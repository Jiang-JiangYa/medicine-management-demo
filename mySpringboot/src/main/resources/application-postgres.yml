spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${JDBC_DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 20000
      initialization-fail-timeout: 30000
app:
  db-type: postgresql
  upload-enabled: ${UPLOAD_ENABLED:false}
