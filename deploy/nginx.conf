# Replace demo.example.com and certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=demo_login:10m rate=5r/m;
server {
    listen 80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/medicine-demo/web;
    index index.html;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /api/user/login {
        limit_req zone=demo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081/user/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        add_header Cache-Control no-store always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        add_header Cache-Control no-store always;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location = /index.html { add_header Cache-Control no-cache; }
    location / { try_files $uri $uri/ /index.html; }
}
